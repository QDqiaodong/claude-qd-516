spring:
  datasource:
    url: jdbc:h2:mem:pottery;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  # 测试不连 Redis
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Actuator 不需要真实 Redis 健康检查
management:
  health:
    redis:
      enabled: false
